name: Bilance hráčů proti týmům

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"   # každé pondělí ráno (UTC)

permissions:
  contents: write

jobs:
  bilance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Stáhnout zápasy hráčů a vygenerovat data
        run: python scripts/bilance_tymy.py
      - name: Uložit změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A scripts docs
          git diff --cached --quiet || git commit -m "Aktualizace bilance proti týmům"
          git pull --rebase
          git push
