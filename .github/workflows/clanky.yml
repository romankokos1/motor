name: Hlídač článků

on:
  schedule:
    - cron: "17 6,11,16,21 * * *"   # cca 7:17, 12:17, 17:17, 22:17 SEČ
  workflow_dispatch:

concurrency:
  group: clanky
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/clanky.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A docs/clanky docs/clanky.json 2>/dev/null || git add -A docs/clanky
          git diff --cached --quiet && exit 0
          git commit -m "Články: aktualizace"
          git pull --rebase
          git push
