name: Gratulace z Facebooku

on:
  workflow_dispatch:
    inputs:
      od:
        description: "Od (RRRR-MM-DD)"
        required: true
      do:
        description: "Do (RRRR-MM-DD)"
        required: true

permissions:
  contents: write

jobs:
  stahnout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Stáhnout gratulace
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python gratulace.py "${{ inputs.od }}" "${{ inputs.do }}"
      - name: Uložit do repa
        run: |
          git config user.name  "gratulace-bot"
          git config user.email "gratulace-bot@users.noreply.github.com"
          git add gratulace/
          git diff --cached --quiet || git commit -m "Gratulace ${{ inputs.od }} – ${{ inputs.do }}"
          git push
