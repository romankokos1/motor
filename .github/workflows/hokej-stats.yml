name: Hlídač hokejových statistik

on:
  schedule:
    # Trvalý čas: 7:17 pražského času (léto=UTC+2 => 5:17 UTC,
    # zima=UTC+1 => 6:17 UTC). Necelá minuta schválně, aby se
    # nepotkávalo s frontou cronů na kulatou hodinu. Tenhle řádek
    # záměrně dál neměníme (viz diskuze o tom, že časté přepisování
    # cron výrazu možná bránilo GitHubu si plán "usadit") — necháváme
    # běžet a čekáme na zítřejší ráno.
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r scripts/requirements.txt

      - name: Spustit hlídač
        run: python scripts/hokej_stats.py

      - name: Commitnout novou stránku a stav
        run: |
          git config user.name "hokej-hlidac-bot"
          git config user.email "actions@github.com"
          git add docs/stats.html scripts/state.json scripts/history.json scripts/month_boundaries.json scripts/schedule_watch.json scripts/schedule_changes_log.json
          git diff --staged --quiet || git commit -m "Aktualizace statistik [skip ci]"
          git push
