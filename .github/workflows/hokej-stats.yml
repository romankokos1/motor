name: Hlídač hokejových statistik

on:
  schedule:
    # 7:00 pražského času (léto=UTC+2 => 5:00 UTC, zima=UTC+1 => 6:00 UTC)
    # cron je vždy v UTC a nepřepíná se sám na letní/zimní čas, takže
    # tady je nastaveno 5:00 UTC (aktuálně platí letní čas) — až se na
    # podzim přejde na zimní čas, budeš dostávat aktualizaci v 8:00
    # místo v 7:00, pokud to nechceš, stačí pak přepsat na "0 6 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r scripts/requirements.txt

      - name: Spustit hlídač
        run: python scripts/hokej_stats.py

      - name: Commitnout novou stránku a stav
        run: |
          git config user.name "hokej-hlidac-bot"
          git config user.email "actions@github.com"
          git add docs/stats.html scripts/state.json
          git diff --staged --quiet || git commit -m "Aktualizace statistik [skip ci]"
          git push
