name: Hlídač hokejových statistik

on:
  schedule:
    # Trvalý čas: 7:17 pražského času (léto=UTC+2 => 5:17 UTC,
    # zima=UTC+1 => 6:17 UTC). Necelá minuta schválně, aby se
    # nepotkávalo s frontou cronů na kulatou hodinu. Tenhle řádek
    # záměrně dál neměníme (viz diskuze o tom, že časté přepisování
    # cron výrazu možná bránilo GitHubu si plán "usadit") — necháváme
    # běžet a čekáme na zítřejší ráno.
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r scripts/requirements.txt

      - name: Spustit hlídač
        run: python scripts/hokej_stats.py

      - name: Commitnout novou stránku a stav
        run: |
          git config user.name "hokej-hlidac-bot"
          git config user.email "actions@github.com"
          [ -f docs/sestavy-data.json ] && git add docs/sestavy-data.json
          git add docs/stats.html scripts/state.json scripts/history.json scripts/month_boundaries.json scripts/schedule_watch.json scripts/schedule_changes_log.json scripts/zapis_state.json scripts/bilance_live.json scripts/bilance_salt.txt docs/bilance_data.json docs/h
          if git diff --cached --quiet; then
            echo "Žádná změna ve statistikách."
            exit 0
          fi
          git commit -m "Aktualizace statistik [skip ci]"
          # Ostatní workflow mohou mezitím pushnout — stáhnout jejich commity a zkusit znovu.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
