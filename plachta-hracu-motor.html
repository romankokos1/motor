// --- vyrovnání fotek ---
// Změří barvu obličejové části každé fotky (přes wsrv.nl, jinak prohlížeč pixely nepustí),
// vezme medián celé soupisky jako cíl a každé fotce spočítá vlastní SVG filtr:
// zesílení R, G, B (jas + vyvážení bílé) a kontrast kolem cílového jasu.
let levelOn = false, levelK = 1, levelRun = 0;
const levelStats = {};   // jméno → {r, g, b, l, sd} v rozsahu 0–1, nebo {err:true}
const levelFix = {};     // jméno → {gr, gg, gb, c}
const LVL_NS = 'http://www.w3.org/2000/svg';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const median = a => { const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const slugOf = p => translit(p.name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
let levelTarget = null;

function measurePhoto(p, img){
  return new Promise(res => {
    if (levelStats[p.name]) return res();
    let tries = 0;
    const go = () => {
      if (!img.dataset.orig){
        if (++tries > 20 || !img.isConnected){ levelStats[p.name] = {err:true}; return res(); }
        return setTimeout(go, 300);
      }
      corsImage(img.dataset.orig, 64, im => {
        try {
          const cv = document.createElement('canvas');
          cv.width = cv.height = 64;
          const ctx = cv.getContext('2d');
          ctx.drawImage(im, 0, 0, 64, 64);
          // obličejová oblast: střed, horní polovina (fotky jsou hlava a ramena)
          const d = ctx.getImageData(19, 8, 26, 28).data;
          let r = 0, g = 0, b = 0, n = 0; const ls = [];
          for (let k = 0; k < d.length; k += 4){
            r += d[k]; g += d[k + 1]; b += d[k + 2]; n++;
            ls.push((0.3 * d[k] + 0.59 * d[k + 1] + 0.11 * d[k + 2]) / 255);
          }
          const l = ls.reduce((x, y) => x + y, 0) / n;
          const sd = Math.sqrt(ls.reduce((x, y) => x + (y - l) ** 2, 0) / n);
          levelStats[p.name] = {r: r / n / 255, g: g / n / 255, b: b / n / 255, l, sd};
        } catch (e){ levelStats[p.name] = {err:true}; }
        res();
      }, () => { levelStats[p.name] = {err:true}; res(); });
    };
    go();
  });
}

function computeLevel(){
  const ok = ROSTER.map(p => levelStats[p.name]).filter(s => s && !s.err);
  if (ok.length < 2){ levelTarget = null; return; }
  levelTarget = {r: median(ok.map(s => s.r)), g: median(ok.map(s => s.g)), b: median(ok.map(s => s.b)),
                 l: median(ok.map(s => s.l)), sd: median(ok.map(s => s.sd))};
  const svg = document.querySelector('body > svg');
  ROSTER.forEach(p => {
    const st = levelStats[p.name];
    if (!st || st.err) return;
    const k = levelK, T = levelTarget;
    const f = {
      gr: 1 + (clamp(T.r / st.r, .82, 1.22) - 1) * k,
      gg: 1 + (clamp(T.g / st.g, .82, 1.22) - 1) * k,
      gb: 1 + (clamp(T.b / st.b, .82, 1.22) - 1) * k,
      // kontrast jen jemně: vousy a vlasy v obličejové oblasti zvyšují rozptyl jasu, i když fotka není kontrastnější
      c:  1 + (clamp(T.sd / st.sd, .94, 1.08) - 1) * k,
    };
    levelFix[p.name] = f;
    const id = 'lvl-' + slugOf(p);
    let el = document.getElementById(id);
    if (!el){
      el = document.createElementNS(LVL_NS, 'filter');
      el.id = id;
      el.setAttribute('color-interpolation-filters', 'sRGB');
      el.appendChild(document.createElementNS(LVL_NS, 'feColorMatrix'));
      const ct = el.appendChild(document.createElementNS(LVL_NS, 'feComponentTransfer'));
      ['feFuncR', 'feFuncG', 'feFuncB'].forEach(t => ct.appendChild(document.createElementNS(LVL_NS, t)));
      svg.appendChild(el);
    }
    const cm = el.firstChild;
    cm.setAttribute('type', 'matrix');
    cm.setAttribute('values', levelMatrix(f));
    [...el.lastChild.children].forEach(fn => {
      fn.setAttribute('type', 'linear');
      fn.setAttribute('slope', num3(f.c));
      fn.setAttribute('intercept', num3(T.l * (1 - f.c)));
    });
  });
}
const levelMatrix = f => `${num3(f.gr)} 0 0 0 0  0 ${num3(f.gg)} 0 0 0  0 0 ${num3(f.gb)} 0 0  0 0 0 1 0`;
function levelIds(){
  return Object.fromEntries(ROSTER.filter(p => levelFix[p.name]).map(p => [p.name, 'lvl-' + slugOf(p)]));
}
function applyLevelVars(){
  tiles.forEach((t, i) => {
    const p = players[i];
    if (levelFix[p.name]) t.style.setProperty('--lvf', `url(#lvl-${slugOf(p)})`);
    else t.style.removeProperty('--lvf');
  });
}

async function runLevel(){
  const run = ++levelRun;
  const st = document.getElementById('levelStatus');
  st.textContent = 'Měřím fotky…';
  await Promise.all(players.map((p, i) => measurePhoto(p, imgs[i])));
  if (run !== levelRun) return;
  computeLevel();
  applyLevelVars();
  const shown = players.map(p => levelStats[p.name]);
  const bad = shown.filter(s => !s || s.err).length;
  st.textContent = !levelTarget
    ? 'Fotky se nepodařilo změřit: služba wsrv.nl neodpovídá nebo fotky nejdou načíst.'
    : `Vyrovnáno ${shown.length - bad} z ${shown.length} fotek` + (bad ? `, ${bad} se nepodařilo změřit.` : '.');
  renderLevelTable();
  if (current.id === 'level') renderCode();
}

function setLevel(on){
  levelOn = on;
  const btn = document.getElementById('levelBtn');
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', on);
  sheet.className = sheetClass();
  if (on) runLevel();
}

function renderLevelTable(){
  const box = document.getElementById('levelTable');
  if (!levelTarget){ box.innerHTML = ''; return; }
  const pct = v => (v >= 1 ? '+' : '−') + Math.abs(Math.round((v - 1) * 100)) + ' %';
  const warm = s => Math.round((s.r - s.b) * 100);
  const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
  const rows = players.map(p => {
    const s = levelStats[p.name], f = levelFix[p.name];
    if (!s || s.err || !f) return `<tr class="off"><td>${p.name}</td><td colspan="4">nezměřeno</td></tr>`;
    const jas = (0.3 * f.gr + 0.59 * f.gg + 0.11 * f.gb);
    return `<tr><td>${p.name}</td>`
      + `<td><span class="bar" style="width:${Math.round(s.l * 60)}px"></span>${Math.round(s.l * 100)}</td>`
      + `<td>${sgn(warm(s))}</td>`
      + `<td>${pct(jas)}</td>`
      + `<td>${pct(f.c)}</td></tr>`;
  }).join('');
  box.innerHTML = `<table><thead><tr><th>Hráč</th><th>Jas obličeje (cíl ${Math.round(levelTarget.l * 100)})</th>`
    + `<th>Teplota (cíl ${sgn(warm(levelTarget))})</th><th>Úprava jasu</th><th>Úprava kontrastu</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function levelCode(){
  if (!levelTarget) return '/* zatím nezměřeno: zapni Vyrovnat fotky */';
  const list = ROSTER.filter(p => levelFix[p.name]);
  const filters = list.map(p => {
    const f = levelFix[p.name];
    return `  <filter id="lvl-${slugOf(p)}" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="${levelMatrix(f)}"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="${num3(f.c)}" intercept="${num3(levelTarget.l * (1 - f.c))}"/>
      <feFuncG type="linear" slope="${num3(f.c)}" intercept="${num3(levelTarget.l * (1 - f.c))}"/>
      <feFuncB type="linear" slope="${num3(f.c)}" intercept="${num3(levelTarget.l * (1 - f.c))}"/>
    </feComponentTransfer>
  </filter>`;
  }).join('\n');
  const map = list.map(p => `  "${p.name}": "lvl-${slugOf(p)}",`).join('\n');
  return `<!-- jeden filtr na hráče: zesílení R, G, B (jas a vyvážení bílé) + kontrast kolem cílového jasu -->
<svg width="0" height="0" style="position:absolute">
${filters}
</svg>

.tile .photo{ filter:var(--lvf, none); }

// JS: při vytváření dlaždice
const VYROVNANI = {
${map}
};
if (VYROVNANI[p.name]) tile.style.setProperty('--lvf', 'url(#' + VYROVNANI[p.name] + ')');`;
}

document.getElementById('levelBtn').addEventListener('click', () => setLevel(!levelOn));
document.getElementById('lvk').addEventListener('input', e => {
  levelK = +e.target.value / 100;
  document.getElementById('lvko').textContent = e.target.value + ' %';
  if (!levelTarget) return;
  computeLevel();
  renderLevelTable();
  if (current.id === 'level') renderCode();
});

const ASCII_RAMP = ' .:-=+*#%@';
function makeAscii(photo, img){
  const pre = photo.querySelector('.ascii');
  if (!pre || pre.dataset.done) return;
  pre.textContent = '\n  načítám…';
  whenLoaded(img, () => corsImage(img.dataset.orig, 240, im => {
    try {
      const C = 60, R = 33;                     // znaky mají poměr cca 0,55, proto méně řádků
      const cv = document.createElement('canvas');
      cv.width = C; cv.height = R;
      const ctx = cv.getContext('2d');
      ctx.drawImage(im, 0, 0, C, R);
      const d = ctx.getImageData(0, 0, C, R).data;
      const lum = [];
      for (let k = 0; k < d.length; k += 4) lum.push(0.3 * d[k] + 0.59 * d[k+1] + 0.11 * d[k+2]);
      const lo = Math.min(...lum), hi = Math.max(...lum), span = Math.max(1, hi - lo);
      let out = '';
      for (let y = 0; y < R; y++){
        for (let x = 0; x < C; x++){
          const t = (lum[y * C + x] - lo) / span;
          out += ASCII_RAMP[Math.min(ASCII_RAMP.length - 1, Math.floor(t * ASCII_RAMP.length))];
        }
        out += '\n';
      }
      pre.textContent = out;
      pre.dataset.done = '1';
    } catch (e){ pre.textContent = '\n  pixely nejdou přečíst'; }
  }, () => { pre.textContent = '\n  wsrv.nl nedostupný'; }));
}

function makePalette(photo, img, tile){
  const box = photo.querySelector('.palette');
  if (!box || box.dataset.done) return;
  box.innerHTML = '<div class="msg">načítám…</div>';
  whenLoaded(img, () => corsImage(img.dataset.orig, 60, im => {
    try {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 60;
      const ctx = cv.getContext('2d');
      ctx.drawImage(im, 0, 0, 60, 60);
      const d = ctx.getImageData(0, 0, 60, 60).data;
      // seskupení podobných barev do košů 8×8×8
      const bins = new Map();
      for (let k = 0; k < d.length; k += 4){
        const key = (d[k] >> 5) << 6 | (d[k+1] >> 5) << 3 | (d[k+2] >> 5);
        const b = bins.get(key) || {r:0, g:0, b:0, n:0};
        b.r += d[k]; b.g += d[k+1]; b.b += d[k+2]; b.n++;
        bins.set(key, b);
      }
      const cols = [...bins.values()]
        .map(b => ({r:b.r / b.n, g:b.g / b.n, b:b.b / b.n, n:b.n}))
        .sort((a, b) => b.n - a.n);
      const pick = [];
      for (const c of cols){
        if (pick.every(q => Math.hypot(q.r - c.r, q.g - c.g, q.b - c.b) > 60)) pick.push(c);
        if (pick.length === 5) break;
      }
      const hex = c => '#' + [c.r, c.g, c.b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
      const sat = c => { const mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b); return mx ? (mx - mn) / mx : 0; };
      const dom = pick.slice().sort((a, b) => sat(b) * Math.sqrt(b.n) - sat(a) * Math.sqrt(a.n))[0];
      tile.style.setProperty('--dom', hex(dom));
      box.innerHTML = pick.map(c => {
        const light = 0.3 * c.r + 0.59 * c.g + 0.11 * c.b > 140;
        return `<div style="background:${hex(c)}"><span style="color:${light ? '#0b0f14' : '#fff'}">${hex(c)}</span></div>`;
      }).join('');
      box.dataset.done = '1';
    } catch (e){ box.innerHTML = '<div class="msg">pixely nejdou přečíst</div>'; }
  }, () => { box.innerHTML = '<div class="msg">wsrv.nl nedostupný</div>'; }));
}

// lupa: přepočet z kurzoru na bod v obrázku (respektuje object-fit:cover + top)
function moveLoupe(e, photo, img){
  if (!img.naturalWidth || !img.isConnected) return;
  const r = photo.getBoundingClientRect();
  const W = r.width, H = r.height;
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  const ox = (W - w) / 2, oy = 0;
  const u = (cx - ox) / w, v = (cy - oy) / h;
  const Z = 2.5;
  photo.style.setProperty('--cx', cx + 'px');
  photo.style.setProperty('--cy', cy + 'px');
  photo.style.setProperty('--lbs', `${w * Z}px ${h * Z}px`);
  photo.style.setProperty('--lbp', `${cx - u * w * Z}px ${cy - v * h * Z}px`);
  photo.style.setProperty('--lens', 1);
}

// pixel art: zmenšit na N×N a zpět zvětšit bez vyhlazení
function drawPixel(photo){
  const img = photo.querySelector('img');
  if (!img || !img.naturalWidth) return;
  const N = +document.getElementById('pixn').value;
  let big = photo.querySelector('canvas.pix');
  if (!big){ big = document.createElement('canvas'); big.className = 'pix'; photo.appendChild(big); }
  const side = Math.min(img.naturalWidth, img.naturalHeight);
  const sx = (img.naturalWidth - side) / 2, sy = 0;
  const small = document.createElement('canvas');
  small.width = small.height = N;
  small.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, N, N);
  const px = Math.round(photo.clientWidth * (window.devicePixelRatio || 1));
  big.width = big.height = px;
  const ctx = big.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(small, 0, 0, N, N, 0, 0, px, px);
}
function clearPixel(){ photos.forEach(ph => ph.querySelector('canvas.pix')?.remove()); }
document.getElementById('pixn').addEventListener('input', e => {
  document.getElementById('pixo').textContent = e.target.value;
  if (current.id === 'pixel') photos.forEach(drawPixel);
});

function leaveFx(id){
  if (id === 'pixel') clearPixel();
  if (id === 'entry') tiles.forEach(t => t.classList.remove('pre'));
  if (id === 'flip') tiles.forEach(t => t.classList.remove('flipped'));
  if (id === 'loupe') photos.forEach(ph => ph.style.removeProperty('--lens'));
  if (id === 'auto'){
    imgs.forEach(img => {
      if (img.dataset.mode === 'proxy'){ img.dataset.mode = ''; img.src = img.dataset.orig; }
    });
  }
  if (id === 'tilt'){
    tiles.forEach(t => ['--rx','--ry','--glare'].forEach(v => t.style.removeProperty(v)));
  }
}
function enterFx(id){
  if (id === 'mosaic') makeMosaic();
  if (id === 'ascii') photos.forEach((ph, j) => makeAscii(ph, imgs[j]));
  if (id === 'palette') photos.forEach((ph, j) => makePalette(ph, imgs[j], tiles[j]));
  document.getElementById('pixctl').classList.toggle('show', id === 'pixel');
  document.getElementById('labctl').classList.toggle('show', id === 'lab');
  document.getElementById('levelctl').classList.toggle('show', id === 'level');
  if (id === 'level' && !levelOn) setLevel(true);
  if (id === 'motm' && !tiles.some(t => t.classList.contains('motm'))) tiles[5].classList.add('motm');
  if (id === 'entry'){
    tiles.forEach(t => t.classList.add('pre'));
    void sheet.offsetWidth;
    tiles.forEach((t, j) => setTimeout(() => t.classList.remove('pre'), 120 + j * 110));
  }
  if (id === 'pixel') photos.forEach(drawPixel);
  if (id === 'auto'){
    imgs.forEach(img => {
      if (img.isConnected && img.dataset.orig){ img.dataset.mode = 'proxy'; img.src = proxyUrl(img.dataset.orig); }
    });
  }
  if (id === 'load'){
    photos.forEach((ph, j) => {
      if (!ph.querySelector('img')) return;
      ph.classList.add('loading');
      setTimeout(() => ph.classList.remove('loading'), 600 + j * 200);
    });
  }
}

function setFx(i){
  if (current.id !== effects[i].id) leaveFx(current.id);
  enterFx(effects[i].id);
  curIdx = i;
  current = effects[i];
  sheet.className = sheetClass();
  navBtns.forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
  document.getElementById('fxName').textContent = current.name;
  document.getElementById('fxDesc').textContent = current.desc;
  document.getElementById('tuner').classList.toggle('show', current.id === 'tune');
  document.getElementById('combo').classList.toggle('show', current.id === 'combo');
  tiles.forEach((t, j) => t.classList.toggle('sel', current.id === 'tune' && j === sel));
  renderCode();
}

// --- ladění ---
const tx = document.getElementById('tx'), ty = document.getElementById('ty'), tz = document.getElementById('tz');
function applyTune(i){
  const t = tune[i], el = tiles[i];
  el.style.setProperty('--x', t.x + '%');
  el.style.setProperty('--y', t.y + '%');
  el.style.setProperty('--z', t.z);
  el.classList.toggle('tuned', !isDefaultTune(t));
}
function syncTuner(){
  const t = tune[sel];
  tx.value = t.x; ty.value = t.y; tz.value = t.z;
  document.getElementById('ox').textContent = t.x + ' %';
  document.getElementById('oy').textContent = t.y + ' %';
  document.getElementById('oz').textContent = Number(t.z).toFixed(2) + '×';
  document.getElementById('tuneName').textContent = players[sel].name;
  comboNote();
  tiles.forEach((el, j) => el.classList.toggle('sel', j === sel));
  renderCode();
}
[tx, ty, tz].forEach(inp => inp.addEventListener('input', () => {
  tune[sel] = {x:+tx.value, y:+ty.value, z:+tz.value};
  if (isDefaultTune(tune[sel])) delete tuneByName[players[sel].name];
  else tuneByName[players[sel].name] = tune[sel];
  applyTune(sel);
  syncTuner();
}));
document.getElementById('treset').addEventListener('click', () => {
  tune[sel] = {...TUNE_DEFAULT};
  delete tuneByName[players[sel].name];
  applyTune(sel);
  syncTuner();
});

function tuneCode(){
  const changed = ROSTER.filter(p => tuneByName[p.name]).map(p => ({p, t:tuneByName[p.name]}));
  const dataLines = changed.length
    ? changed.map(({p, t}) => `  {num:${p.num}, name:"${p.name}", ..., focus:"${t.x}% ${t.y}%", zoom:${Number(t.z).toFixed(2)}},`).join('\n')
    : '  // zatím žádná úprava, klikni na hráče a pohni posuvníkem';
  return `<span class="c">// 1) do pole players doplň u upravených hráčů:</span>
${esc(dataLines)}

<span class="c">// 2) při vytváření dlaždice:</span>
if (p.focus) img.style.objectPosition = p.focus;
if (p.zoom){
  img.style.transform = \`scale(\${p.zoom})\`;
  img.style.transformOrigin = p.focus || 'center top';
}`;
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderCode(){
  const codeEl = document.getElementById('code');
  if (current.id === 'tune'){
    document.getElementById('codeLabel').textContent = 'JavaScript';
    codeEl.innerHTML = tuneCode();
  } else {
    document.getElementById('codeLabel').textContent = 'CSS';
    codeEl.innerHTML = esc(current.id === 'combo' ? comboCode() : current.id === 'lab' ? labCode() : current.id === 'level' ? levelCode() : current.code).replace(/(\/\*.*?\*\/|&lt;!--.*?--&gt;|(?:^|\s)\/\/[^\n]*)/gm, '<span class="c">$1</span>');
  }
}

// --- porovnání s původním ---
const cmp = document.getElementById('compare');
function rawOn(){ sheet.className = 'sheet fx-orig'; cmp.classList.add('on'); }
function rawOff(){ sheet.className = sheetClass(); cmp.classList.remove('on'); }

const splitBtn = document.getElementById('splitBtn');
const splitRange = document.getElementById('splitRange');
splitBtn.addEventListener('click', () => {
  splitOn = !splitOn;
  sheet.classList.toggle('split', splitOn);
  splitBtn.classList.toggle('on', splitOn);
  splitBtn.setAttribute('aria-pressed', splitOn);
  splitRange.hidden = !splitOn;
});
splitRange.addEventListener('input', () => sheet.style.setProperty('--split', splitRange.value + '%'));
cmp.addEventListener('pointerdown', rawOn);
['pointerup','pointerleave','pointercancel'].forEach(e => cmp.addEventListener(e, rawOff));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight'){ e.preventDefault(); setFx((curIdx + 1) % effects.length); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ e.preventDefault(); setFx((curIdx - 1 + effects.length) % effects.length); }
  if (e.key === ' ' && !e.repeat){ e.preventDefault(); rawOn(); }
});
document.addEventListener('keyup', e => { if (e.key === ' ') rawOff(); });

// --- kopírování ---
document.getElementById('copy').addEventListener('click', async () => {
  const text = document.getElementById('code').textContent;
  const btn = document.getElementById('copy');
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Zkopírováno'; }
  catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Označeno, Ctrl+C'; }
  setTimeout(() => btn.textContent = 'Kopírovat', 1500);
});

fillSelect('cPhoto', COMBO_PHOTO, cPhoto, v => cPhoto = v);
fillSelect('cGfx', COMBO_GFX, cGfx, v => cGfx = v);
applyLab();
document.getElementById('exportBtn').addEventListener('click', exportPlachta);
comboNote();

// --- celá soupiska / ukázka ---
const rosterBtn = document.getElementById('rosterBtn');
let fullRoster = false;
rosterBtn.addEventListener('click', () => {
  fullRoster = !fullRoster;
  rosterBtn.classList.toggle('on', fullRoster);
  rosterBtn.setAttribute('aria-pressed', fullRoster);
  rosterBtn.textContent = fullRoster ? 'Jen ukázka (8)' : 'Celá soupiska (31)';
  leaveFx(current.id);
  players = fullRoster ? ROSTER : SAMPLE_PLAYERS;
  buildSheet(players);
  enterFx(current.id);
  sheet.className = sheetClass();
  syncTuner();
  if (levelOn) runLevel();
});

syncTuner();
setFx(0);
