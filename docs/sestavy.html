<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sestavy ze zápisu</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --ink: #16202e; --muted: #6a7280; --line: #dcd9d0;
    --accent: #0f3d75; --accent-ink: #ffffff; --ok: #1f7a46; --warn: #a1520c; --field: #fbfaf7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151d; --card: #18202b; --ink: #e6e9ee; --muted: #8f99a8; --line: #2b3646;
      --accent: #5d9be8; --accent-ink: #0b1220; --ok: #5cc48a; --warn: #e3a35c; --field: #131a24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: .01em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .small { font-size: 13px; color: var(--muted); }
  select, input[type=text], textarea {
    font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
  }
  select { flex: 1 1 340px; min-width: 0; }
  input[type=text] { flex: 1 1 220px; min-width: 0; }
  button, .btn {
    font: inherit; font-size: 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  button.ghost, .btn.ghost { background: transparent; color: var(--accent); }
  #status { margin: 10px 0 0; font-size: 13px; color: var(--muted); min-height: 1.2em; }
  #status.ok { color: var(--ok); } #status.warn { color: var(--warn); }
  .block { margin-bottom: 14px; }
  .block:last-of-type { margin-bottom: 0; }
  .block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .block-head strong { font-size: 14px; }
  textarea.out { width: 100%; min-height: 92px; resize: vertical; line-height: 1.5; }
  textarea.out.report { min-height: 130px; }
  .check { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .check b { color: var(--ink); font-weight: 600; }
  #paste-box { display: none; }
  #paste { width: 100%; min-height: 70px; margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Sestavy ze zápisu o utkání</h1>

  <div class="card">
    <div class="row">
      <select id="kolo" aria-label="Zápas"><option>Načítám rozpis…</option></select>
      <button id="load">Načíst</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="manual" placeholder="ID nebo odkaz na zápis">
      <button class="ghost" id="load-manual">Načíst podle ID</button>
      <a class="btn ghost hidden" id="open-zapis" target="_blank" rel="noopener">Otevřít zápis ↗</a>
    </div>
    <div class="row small" style="margin-top:8px; gap: 6px 18px">
      <label><input type="checkbox" id="motor-first"> Motor vždy první</label>
      <label><input type="checkbox" id="bold-labels"> Tučné popisky v zápisu (HTML &lt;b&gt;)</label>
    </div>
    <p id="status"></p>
  </div>

  <div class="card" id="paste-box">
    <strong style="font-size:14px">Vložit zápis ze schránky</strong>
    <textarea id="paste" placeholder="Ctrl+V"></textarea>
  </div>

  <div class="card hidden" id="result">
    <div id="teams"></div>
    <div class="block">
      <div class="block-head"><strong>Zápis utkání</strong><button class="ghost" id="copy-report">Kopírovat</button></div>
      <textarea class="out report" id="report" spellcheck="false"></textarea>
      <div class="check" id="report-check"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="copy-all">Kopírovat vše</button>
    </div>
  </div>

  <div class="card hidden" id="extra">
    <div class="block" id="changes-block">
      <div class="block-head"><strong>Změny v sestavě Motoru</strong><button class="ghost" data-copy="changes">Kopírovat</button></div>
      <textarea class="out" id="changes" spellcheck="false"></textarea>
    </div>
    <div class="block" id="titles-block">
      <div class="block-head"><strong>Titulky</strong><button class="ghost" data-copy="titles">Kopírovat</button></div>
      <textarea class="out" id="titles" spellcheck="false"></textarea>
    </div>
    <div class="block" id="story-block">
      <div class="block-head"><strong>Návrh úvodu</strong><button class="ghost" data-copy="story">Kopírovat</button></div>
      <textarea class="out" id="story" spellcheck="false"></textarea>
    </div>
  </div>
</main>

<script src="zapis-core.js"></script>
<script>
// ===== UI ===================================================================

let current = null;       // aktuálně zobrazený model zápasu

function setStatus(msg, cls = "") { const s = $("status"); s.textContent = msg; s.className = cls; }

function showZapisLink(id) {
  const a = $("open-zapis");
  if (id) { a.href = ZAPIS_URL(id); a.classList.remove("hidden"); } else a.classList.add("hidden");
}

function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

function render(m) {
  current = m;
  // rozhodující nájezd vede zápis i jako gól (65:00+) — do branek ani průběhu nepatří
  if (m.najezdy.length) m.goly = m.goly.filter(g => g.sec < 3900);
  const namer = makeNamer(m);
  const lines = buildLines(m, namer, $("motor-first").checked);
  const box = $("teams");
  box.innerHTML = "";
  lines.forEach((l, i) => {
    const div = document.createElement("div");
    div.className = "block";
    const c = l.check;
    const warn = [];
    if (!c.gk) warn.push("v soupisce není brankář");
    if (!c.trenéři) warn.push("v zápisu nejsou trenéři");
    div.innerHTML = `
      <div class="block-head"><strong></strong><button class="ghost" data-i="${i}">Kopírovat</button></div>
      <textarea class="out lineup" spellcheck="false"></textarea>
      <div class="check"></div>`;
    div.querySelector("strong").textContent = l.nazev;
    div.querySelector("textarea").value = l.text;
    div.querySelector(".check").innerHTML =
      `brankáři <b>${c.gk}</b> · obránci <b>${c.d}</b> · útočníci <b>${c.f}</b>` +
      (c.nehrali.length ? ` · nenastoupili: ${esc(c.nehrali.join(", "))}` : "") +
      (warn.length ? `<br>⚠️ ${esc(warn.join("; "))}` : "");
    box.appendChild(div);
  });

  if (m.jeZapis) {
    const r = buildReport(m, namer, $("bold-labels").checked);
    $("report").value = r.text;
    $("report-check").innerHTML = `góly <b>${m.goly.length}</b> · tresty <b>${m.tresty.length}</b>` +
      (r.warn.length ? `<br>⚠️ ${esc(r.warn.join("; "))}` : "");
  } else {
    $("report").value = "";
    $("report-check").textContent = "V datech zatím nejsou údaje o průběhu — vlož zápis ze schránky.";
  }
  $("result").classList.remove("hidden");

  const changes = buildChanges(m, namer, currentKolo);
  const story = m.jeZapis && m.goly.length + m.najezdy.length ? buildStory(m, namer, currentKolo) : "";
  $("changes").value = changes;
  $("story").value = story;
  const titles = m.jeZapis && m.goly.length + m.najezdy.length ? buildHeadlines(m, namer, currentKolo).join("\n") : "";
  $("titles").value = titles;
  $("titles-block").classList.toggle("hidden", !titles);
  $("changes-block").classList.toggle("hidden", !changes);
  $("story-block").classList.toggle("hidden", !story);
  $("extra").classList.toggle("hidden", !changes && !story && !titles);
}

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  const old = btn.textContent; btn.textContent = "Zkopírováno ✓"; setTimeout(() => (btn.textContent = old), 1400);
}

$("teams").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if (b) copyText(b.closest(".block").querySelector("textarea").value, b);
});
$("extra").addEventListener("click", e => {
  const b = e.target.closest("button[data-copy]");
  if (b) copyText($(b.dataset.copy).value, b);
});
$("copy-report").addEventListener("click", e => copyText($("report").value, e.target));
$("copy-all").addEventListener("click", e =>
  copyText([...document.querySelectorAll("textarea.lineup"), $("report")].map(t => t.value).filter(Boolean).join("\n"), e.target));

async function loadLive(id) {
  showZapisLink(id);
  $("paste-box").style.display = "none";
  setStatus("Stahuji zápis…");
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 4000);
    const res = await fetch(ZAPIS_URL(id), { signal: ctl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error(res.status);
    const parsed = parseZapis(await res.text(), "");
    if (!parsed) { setStatus("Zápis zatím nemá vyplněné soupisky.", "warn"); return; }
    render(parsed);
    setStatus("Načteno přímo ze zápisu.", "ok");
  } catch (err) {
    $("paste-box").style.display = "block";
    setStatus("Zápis nejde stáhnout přímo — vlož ho ze schránky.", "warn");
  }
}

function selectedGame() {
  const i = $("kolo").value;
  return DATA && i !== "" ? DATA.zapasy[+i] : null;
}

function loadSelected() {
  const g = selectedGame();
  if (!g) return;
  currentKolo = g.kolo;
  showZapisLink(g.hokejcz_id);
  $("paste-box").style.display = "none";
  if (g.sestava) {
    render(modelFromData(g));
    if (!g.zapis) $("paste-box").style.display = "block";
    setStatus(`Ze zápisu uloženého při denní aktualizaci (${DATA.aktualizovano}).`, "ok");
  } else if (g.hokejcz_id) {
    $("result").classList.add("hidden");
    loadLive(g.hokejcz_id);
  } else {
    $("result").classList.add("hidden");
    setStatus("K tomuto kolu zatím není známé ID zápisu.", "warn");
  }
}

$("load").addEventListener("click", loadSelected);
$("kolo").addEventListener("change", loadSelected);
$("load-manual").addEventListener("click", () => {
  const v = $("manual").value;
  const m = /hokejczId=(\d+)/i.exec(v) || /(\d{5,})/.exec(v);
  if (!m) return setStatus("Zadej číslo zápasu nebo celý odkaz na zápis.", "warn");
  currentKolo = (DATA && DATA.zapasy.find(g => String(g.hokejcz_id) === m[1]) || {}).kolo ?? null;
  $("result").classList.add("hidden");
  loadLive(m[1]);
});

$("paste").addEventListener("paste", e => {
  const cd = e.clipboardData;
  const html = cd ? cd.getData("text/html") : "";
  const text = cd ? cd.getData("text/plain") : "";
  e.preventDefault();
  const parsed = parseZapis(html, text);
  if (!parsed) { setStatus("Ve vloženém obsahu nejsou soupisky zápisu.", "warn"); return; }
  $("paste").value = "";
  render(parsed);
  setStatus("Ze zkopírovaného zápisu.", "ok");
});

try { $("motor-first").checked = localStorage.getItem("sestavy-motor-first") === "1"; } catch {}
try { $("bold-labels").checked = localStorage.getItem("sestavy-bold") === "1"; } catch {}
$("bold-labels").addEventListener("change", e => {
  try { localStorage.setItem("sestavy-bold", e.target.checked ? "1" : "0"); } catch {}
  if (current) render(current);
});
$("motor-first").addEventListener("change", e => {
  try { localStorage.setItem("sestavy-motor-first", e.target.checked ? "1" : "0"); } catch {}
  if (current) render(current);
});

function dayMonth(datum) {
  const m = /(\d{1,2})\.\s*(\d{1,2})\./.exec(datum || "");
  return m ? [+m[1], +m[2]] : null;
}

(async function init() {
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    DATA = await res.json();
  } catch {
    $("kolo").innerHTML = "<option value=''>Rozpis není k dispozici</option>";
    return;
  }
  const sel = $("kolo");
  sel.innerHTML = "";
  const now = new Date(), today = [now.getDate(), now.getMonth() + 1];
  let pick = null;
  [...DATA.zapasy.keys()].reverse().forEach(i => {
    const g = DATA.zapasy[i];
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `${g.kolo}. kolo · ${g.datum} · ${g.domaci} – ${g.hoste}` +
      (g.vysledek ? ` ${g.vysledek}` : "") + (g.sestava || g.odehrano ? "" : " (nehráno)");
    sel.appendChild(o);
    const dm = dayMonth(g.datum);
    if (dm && dm[0] === today[0] && dm[1] === today[1]) pick = i;
    if (pick === null && g.odehrano) pick = i;
  });
  if (pick !== null) sel.value = pick;
  setStatus(`Rozpis z ${DATA.aktualizovano}.`);
})();
</script>
</body>
</html>
